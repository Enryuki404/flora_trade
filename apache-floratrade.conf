# Apache reverse proxy config untuk FloraTrade Nusantara (Next.js)
# Letakkan file ini di: C:\xampp\apache\conf\extra\httpd-floratrade.conf
# Lalu include di httpd.conf: Include conf/extra/httpd-floratrade.conf

# Pastikan modul proxy aktif di httpd.conf (hapus # di depan):
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule headers_module modules/mod_headers.so

<VirtualHost *:80>
    ServerName localhost
    # Jika mau domain custom: ServerName floratrade.local
    # Tambahkan ke C:\Windows\System32\drivers\etc\hosts: 127.0.0.1 floratrade.local

    ProxyPreserveHost On
    ProxyRequests Off

    # Next.js dev/prod di port 3000
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket untuk HMR (hot reload pas dev)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Header
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog "logs/floratrade-error.log"
    CustomLog "logs/floratrade-access.log" common
</VirtualHost>

# Untuk HTTPS (opsional, setelah certbot/SSL):
# <VirtualHost *:443>
#   SSLEngine on
#   SSLCertificateFile "conf/ssl.crt/server.crt"
#   SSLCertificateKeyFile "conf/ssl.key/server.key"
#   ProxyPass / http://127.0.0.1:3000/
#   ProxyPassReverse / http://127.0.0.1:3000/
# </VirtualHost>
